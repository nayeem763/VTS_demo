name: Test Suite (1,250 Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest + Coverage (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run full test suite with coverage
        run: |
          pytest --cov=apps --cov-report=term --junitxml=test-results.xml | tee pytest-output.txt

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## CU-VTS Automated Test Report"
            echo ""
            echo '```text'
            tail -n 55 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          retention-days: 30
